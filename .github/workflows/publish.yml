name: Publish to PyPI

# Runs when a GitHub Release is published (e.g. tag v0.2.0) and uploads to PyPI.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Run tests before publishing
        run: |
          pip install -e ".[dev]"
          pytest

      - name: Check the release tag matches __version__
        run: |
          VERSION=$(python -c "import odia_panji; print(odia_panji.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "Package version: $VERSION, release tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match __version__ $VERSION"
            exit 1
          fi

      - name: Build wheel and source archive
        run: python -m build

      - name: Check the package metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/odia-panji
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
